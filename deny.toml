# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Licenses of the current dependency tree. Review before adding any other.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.9

# Workspace crates are `publish = false` and use `license-file` (Fordima
# Public License, which has no SPDX identifier); cargo-deny skips private
# crates with this setting. Copyleft licenses must never be added here: they
# are incompatible with the FPL (see docs/legal/fpl-review.md).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
