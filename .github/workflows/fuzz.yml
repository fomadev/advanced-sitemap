name: Fuzz

# Coverage-guided fuzzing with cargo-fuzz (nightly, libFuzzer), weekly and
# on demand. Each target starts from its committed seed corpus in
# fuzz/corpus/; a crashing input is uploaded as an artifact. The quick,
# reproducible stable-Rust fuzzing runs on every pull request in CI.
on:
  schedule:
    - cron: "17 3 * * 1"
  # Short runs (60 s per target) when the fuzzed code or the targets change.
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/sitemap-reader/**"
      - "crates/sitemap-protocol/**"
      - "crates/sitemap-snapshot/**"
      - "crates/sitemap-validation/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [xml_reader, url_record, change_feed, config, snapshot, scalars]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '60') || '300' }} -max_len=65536
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
