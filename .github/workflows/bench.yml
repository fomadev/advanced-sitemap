name: Benchmarks

# Benchmarks are informative and never block merges. Manual trigger only:
# shared CI runners are too noisy for regression gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo bench -p advanced-sitemap --bench pipeline --locked
