name: Benchmarks

# Benchmarks are informative and never block merges. Manual trigger only:
# shared CI runners are too noisy for regression gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo bench -p advanced-sitemap --bench pipeline --locked
