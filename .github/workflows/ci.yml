name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo test --workspace --locked
      - name: Build release CLI
        run: cargo build --release -p sitemap-cli --locked

  msrv:
    # The minimum supported Rust version declared in Cargo.toml
    # (rust-version) must build and pass the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test --workspace --locked

  fuzz-stable:
    # Reproducible fuzzing on stable Rust (tests/fuzz.rs and the snapshot
    # decoder), longer than in `test`. The coverage-guided campaign is the
    # weekly `fuzz` workflow.
    runs-on: ubuntu-latest
    env:
      FUZZ_ITERATIONS: "100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo test --release --locked -p advanced-sitemap --test fuzz
      - run: cargo test --release --locked -p sitemap-snapshot --test snapshot fuzz

  conformance:
    # Checks the expected fixture files with tools that share no code with
    # the engine: a Python checker (expat) and xmllint against the official
    # sitemaps.org XSD (fixtures without extension namespaces only, because
    # the XSD validates foreign elements strictly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/check_sitemaps.py fixtures/conformance
      - name: Validate against the sitemaps.org XSD
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
          curl -fsSL -o /tmp/sitemap.xsd https://www.sitemaps.org/schemas/sitemap/0.9/sitemap.xsd
          curl -fsSL -o /tmp/siteindex.xsd https://www.sitemaps.org/schemas/sitemap/0.9/siteindex.xsd
          xmllint --noout --schema /tmp/sitemap.xsd fixtures/conformance/basic/expected/sitemap.xml fixtures/conformance/partitioned/expected/sitemap-*.xml
          xmllint --noout --schema /tmp/siteindex.xsd fixtures/conformance/partitioned/expected/sitemap.xml
      - name: Validate the video fixture against Google's video XSD
        run: |
          mkdir -p /tmp/xsd && cp tools/xsd/sitemap-with-video.xsd /tmp/xsd/
          curl -fsSL -o /tmp/xsd/sitemap.xsd https://www.sitemaps.org/schemas/sitemap/0.9/sitemap.xsd
          curl -fsSL -o /tmp/xsd/sitemap-video.xsd https://www.google.com/schemas/sitemap-video/1.1/sitemap-video.xsd
          xmllint --noout --schema /tmp/xsd/sitemap-with-video.xsd fixtures/conformance/video/expected/sitemap.xml
      - name: Validate the news fixture against Google's news XSD
        run: |
          mkdir -p /tmp/xsd && cp tools/xsd/sitemap-with-news.xsd /tmp/xsd/
          curl -fsSL -o /tmp/xsd/sitemap.xsd https://www.sitemaps.org/schemas/sitemap/0.9/sitemap.xsd
          curl -fsSL -o /tmp/xsd/sitemap-news.xsd https://www.google.com/schemas/sitemap-news/0.9/sitemap-news.xsd
          xmllint --noout --schema /tmp/xsd/sitemap-with-news.xsd fixtures/conformance/news/expected/sitemap.xml

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories licenses bans sources
