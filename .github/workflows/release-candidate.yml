name: Release candidate

# Builds and packages the CLI for every supported target, checks each
# binary against the conformance fixtures, and writes SHA256SUMS. The
# archives are kept as workflow artifacts only: this workflow creates no
# tag, no GitHub release and publishes no package. Publishing is a
# separate, explicitly authorized step (docs/production/release-readiness.md).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-candidate.yml
      - tools/package.py
      - tools/notices.py

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, smoke: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true, musl: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain and target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        run: cargo build --release --locked -p sitemap-cli --target ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package (and check against the fixtures)
        shell: bash
        run: >
          python tools/package.py
          --target ${{ matrix.target }}
          --binary "target/${{ matrix.target }}/release/advanced-sitemap${{ runner.os == 'Windows' && '.exe' || '' }}"
          --commit "${GITHUB_SHA::7}"
          --out dist
          ${{ matrix.smoke && '--smoke' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-${{ matrix.target }}
          path: dist/*
          retention-days: 14

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rc-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          rm -f *.sha256
          sha256sum advanced-sitemap-* | tee SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 14
